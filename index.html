<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create and print a HELETT warranty repair slip.">
  <title>HELETT Repair Slip</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17191c;
      background: #f3f4f6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; }
    .app { width: min(100%, 780px); margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    .intro { margin: 0 0 22px; color: #60656d; line-height: 1.5; }
    .panel { padding: 22px; border: 1px solid #d5d8dc; border-radius: 10px; background: #fff; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full, .actions { grid-column: 1 / -1; }
    label { font-size: .95rem; font-weight: 700; }
    input, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #aeb4bd; border-radius: 6px;
      background: #fff; color: #17191c; font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid #6b7280; outline-offset: 1px; }
    textarea { min-height: 78px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 6px; background: #17191c; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #383b40; }
    .privacy-note { margin: 0; color: #60656d; font-size: .9rem; }

    /* Minimal black-and-white 6 x 4 inch repair slip. */
    .print-slip {
      display: none; width: 6in; height: 4in; padding: .27in .28in;
      overflow: hidden; background: #fff; color: #17191c;
    }
    .slip-brand { margin: 0; font-size: 22pt; line-height: 1; font-weight: 900; letter-spacing: .12em; }
    .slip-service { margin: 7px 0 16px; font-size: 10pt; font-weight: 800; letter-spacing: .15em; }
    .slip-heading-row { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .slip-heading { margin: 0; font-size: 29pt; line-height: 1; font-weight: 800; letter-spacing: -.04em; }
    .slip-date { margin: 0 0 3px; text-align: right; font-size: 10pt; font-weight: 700; white-space: nowrap; }
    .rule { height: 2px; margin: 12px 0 14px; background: #17191c; }
    .received-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .received-label, .field-label, .footer-label { margin: 0; font-size: 9pt; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .received-date { margin: 0; font-size: 10pt; font-weight: 700; }
    .slip-fields { display: grid; gap: 10px; margin: 17px 0 0; }
    .slip-field { min-width: 0; }
    .field-label { margin-bottom: 4px; }
    .field-value { margin: 0; font-size: 16pt; line-height: 1.14; font-weight: 700; overflow-wrap: anywhere; }
    .issue-value { font-size: 13pt; }
    .footer-rule { margin: 13px 0 11px; }
    .footer-copy { margin: 6px 0 0; font-size: 10pt; }

    @page { size: 6in 4in; margin: 0; }
    @media print {
      html, body { width: 6in; height: 4in; margin: 0; padding: 0; background: #fff; }
      body { min-height: 0; }
      .app { display: none !important; }
      .print-slip { display: block !important; }
    }
    @media (max-width: 560px) {
      body { padding: 18px 12px; }
      .panel { padding: 16px; }
      form { grid-template-columns: 1fr; }
      .field.full, .actions { grid-column: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>HELETT Repair Slip</h1>
    <p class="intro">Enter the repair details and print a simple 6 × 4 inch slip. Nothing is saved or sent anywhere.</p>
    <section class="panel" aria-label="Repair slip details">
      <form id="repair-form">
        <div class="field">
          <label for="customer">Customer name</label>
          <input id="customer" name="customer" autocomplete="name" required maxlength="70" placeholder="Customer name">
        </div>
        <div class="field">
          <label for="product">SKU / product name</label>
          <input id="product" name="product" required maxlength="70" placeholder="Product or SKU">
        </div>
        <div class="field">
          <label for="date">Date received</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="field full">
          <label for="issue">Issue reported</label>
          <textarea id="issue" name="issue" required maxlength="180" placeholder="Type the reported issue"></textarea>
        </div>
        <div class="actions">
          <button type="submit">Print 4 × 6 slip</button>
          <p class="privacy-note">Print-only. This app does not save your details.</p>
        </div>
      </form>
    </section>
  </main>

  <article class="print-slip" aria-label="HELETT warranty repair slip">
    <p class="slip-brand">HELETT</p>
    <p class="slip-service">WARRANTY SERVICE</p>
    <div class="slip-heading-row">
      <h2 class="slip-heading">Repair Slip</h2>
      <p class="slip-date" id="print-date-top"></p>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div class="received-row">
      <p class="received-label">Date received</p>
      <p class="received-date" id="print-date"></p>
    </div>
    <dl class="slip-fields">
      <div class="slip-field">
        <dt class="field-label">Customer</dt>
        <dd class="field-value" id="print-customer"></dd>
      </div>
      <div class="slip-field">
        <dt class="field-label">SKU</dt>
        <dd class="field-value" id="print-product"></dd>
      </div>
      <div class="slip-field">
        <dt class="field-label">Issue reported</dt>
        <dd class="field-value issue-value" id="print-issue"></dd>
      </div>
    </dl>
    <div class="rule footer-rule" aria-hidden="true"></div>
    <p class="footer-label">Warranty repair</p>
    <p class="footer-copy">Keep this slip with the item.</p>
  </article>

  <script>
    const form = document.getElementById('repair-form');
    const dateInput = document.getElementById('date');

    const today = new Date();
    dateInput.value = [today.getFullYear(), String(today.getMonth() + 1).padStart(2, '0'), String(today.getDate()).padStart(2, '0')].join('-');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const [year, month, day] = dateInput.value.split('-').map(Number);
      const displayDate = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' })
        .format(new Date(year, month - 1, day));

      document.getElementById('print-customer').textContent = document.getElementById('customer').value.trim();
      document.getElementById('print-product').textContent = document.getElementById('product').value.trim();
      document.getElementById('print-issue').textContent = document.getElementById('issue').value.trim();
      document.getElementById('print-date').textContent = displayDate;
      document.getElementById('print-date-top').textContent = displayDate;
      window.print();
    });
  </script>
</body>
</html>
